<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido - IUTEPAL</title>
    <link rel="stylesheet" href="STRUCTURE/CSS/theme.css">
    <link rel="stylesheet" href="STRUCTURE/CSS/bienvenida.css">
</head>
<body>
    <div class="container fade-in">
        <div class="left-panel fade-in fade-in-delay-1">
            <img src="STRUCTURE/IMG/iutepal_logo.png" alt="IUTEPAL Logo" class="logo" >
            <div class="hero-image-container">
                </div>
        </div>
        <div class="right-panel fade-in fade-in-delay-2">
            <h1 class="welcome-text">Bienvenido</h1>
            <h2 class="login-text">INICIO DE SESIÓN</h2>
            
            <button class="btn btn-personal lift-hover fade-in fade-in-delay-3" data-tooltip="Ingresar como administrador para gestionar documentos">Inicio de Sesión como Administrador</button>
            <button class="btn btn-guest lift-hover fade-in fade-in-delay-4" data-tooltip="Iniciar sesión para acceder al sistema">Inicio de Sesión como Estudiante</button>
            <button class="btn btn-register lift-hover fade-in fade-in-delay-5" data-tooltip="Crear una cuenta nueva para ingresar al sistema">Registrarse</button>
            <div class="time-display" id="time-display">HORA:</div>
        </div>
    </div>
    <script src="STRUCTURE/SCRIPTS/bienvenida.js"></script>
</body>
</html>
