<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido - IUTEPAL</title>
    <link rel="icon" type="image/x-icon" href="STRUCTURE/IMG/iutepal.ico">
    <link rel="icon" type="image/png" href="STRUCTURE/IMG/iutepal.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="STRUCTURE/CSS/theme.css">
    <link rel="stylesheet" href="STRUCTURE/CSS/bienvenida.css">
</head>

<body>
    <div class="container fade-in">
        <div class="left-panel fade-in fade-in-delay-1">
            <img src="STRUCTURE/IMG/iutepal_logo.png" alt="IUTEPAL Logo" class="logo">
            <div class="hero-image-container">
            </div>
        </div>
        <div class="right-panel fade-in fade-in-delay-2">
            <h1 class="welcome-text">Bienvenido</h1>
            <h2 class="login-text" style="margin-bottom: 20px;">Iniciar Sesión</h2>

            <!-- Formulario de Login directo -->
            <form class="form" id="login-form">
                <label for="identifier" class="form__label">Identificador (Usuario o Correo):</label>
                <input type="text" class="form__input" id="identifier" placeholder="Usuario o correo@ejemplo.com" required>

                <label for="password" class="form__label">Contraseña:</label>
                <input type="password" class="form__input" id="password" placeholder="Ingrese su contraseña" required style="margin-bottom: 10px;">

                <div class="form__buttons">
                    <button type="submit" class="form__button form__button--primary lift-hover" id="send-login">Aceptar</button>
                </div>

                <p class="toggle-text" style="color: var(--text-on-blue);">
                    ¿No tienes cuenta? <a href="registro.html" style="color: var(--iutepal-yellow); font-weight: bold; text-decoration: none;">Regístrate aquí</a>
                </p>
            </form>
            <div class="time-display" id="time-display">HORA:</div>
        </div>
    </div>
    <script src="STRUCTURE/SCRIPTS/custom-alert.js"></script>
    <script src="STRUCTURE/SCRIPTS/bienvenida.js"></script>
    <script src="login.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker registrado con éxito:', reg.scope))
                    .catch(err => console.error('Error al registrar Service Worker:', err));
            });
        }
    </script>
</body>

</html>
