<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse - IUTEPAL</title>
    <link rel="stylesheet" href="STRUCTURE/CSS/theme.css">
    <link rel="stylesheet" href="STRUCTURE/CSS/login.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
        rel="stylesheet">
</head>

<body>
    <main class="login login--register fade-in">
        <div class="login__container fade-in fade-in-delay-1">
            <h1 class="login__title">Registrarse</h1>
            <form class="form">
                <label for="user" class="form__label">Nombre:</label>
                <input type="text" class="form__input" id="user">

                <label for="apellido" class="form__label">Apellido:</label>
                <input type="text" class="form__input" id="apellido">

                <label for="passwordGuest" class="form__label">Contraseña:</label>
                <input type="password" class="form__input" id="passwordGuest">

                <label for="confirm" class="form__label">Confirmar Contraseña:</label>
                <input type="password" class="form__input" id="confirm">

                <label for="emailGuest" class="form__label">Correo Electrónico:</label>
                <input type="email" class="form__input" id="emailGuest">

                <div class="form__checkbox-row">
                    <input type="checkbox" class="form__checkbox" id="iutepalGuest">
                    <label for="iutepalGuest" class="form__label form__checkbox-label">IUTEPALISTA</label>
                </div>

                <div class="form__buttons">
                    <button type="button" class="form__button form__button--secondary lift-hover" onclick="window.location.href='index.html'">Cancelar</button>
                    <button type="submit" class="form__button form__button--primary lift-hover" id="send">Aceptar</button>
                </div>
            </form>
        </div>
    </main>
    <script>
   (function(){
    const form = document.querySelector('.form');
    const inputNombre = document.getElementById('user');
    const inputApellido = document.getElementById('apellido');
    const inputPassword = document.getElementById('passwordGuest');
    const inputConfirm = document.getElementById('confirm');
    const inputEmail = document.getElementById('emailGuest');
    const inputIutepalista = document.getElementById('iutepalGuest');

    form.addEventListener('submit', async function(e){
        e.preventDefault();

        const nombre = (inputNombre && inputNombre.value || '').trim();
        const apellido = (inputApellido && inputApellido.value || '').trim();
        const password = (inputPassword && inputPassword.value || '').trim();
        const confirm = (inputConfirm && inputConfirm.value || '').trim();
        const email = (inputEmail && inputEmail.value || '').trim().toLowerCase();
        const esIutepalista = inputIutepalista ? inputIutepalista.checked : false;

        if (!nombre || !apellido || !password || !confirm || !email) {
            alert('Complete todos los campos obligatorios.');
            return;
        }
        if (password !== confirm) {
            alert('Las contraseñas no coinciden.');
            return;
        }
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(email)) {
            alert('Ingrese un correo válido.');
            return;
        }

        try {
            const response = await fetch('http://localhost:3000/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nombre, apellido, email, password, esIutepalista })
            });
            const data = await response.json();
            if (response.ok) {
                alert('Usuario registrado exitosamente.');
                window.location.href = 'index.html';
            } else {
                alert('Error al registrar: ' + data.error);
            }
        } catch (error) {
            console.error('Error en registro:', error);
            alert('Error en el servidor.');
        }
    });
})();
    </script>
</body>

</html>
